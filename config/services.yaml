parameters:
    default_email_sender: '%env(string:DEFAULT_EMAIL_SENDER)%'
    application_url: '%env(string:APPLICATION_URL)%'
    app.supported_locales: 'nl|en'
    app.default_locale: 'nl'

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Monolog\Formatter\JsonFormatter: ~
    Monolog\Formatter\HtmlFormatter: ~

imports:
    - { resource: '../lib/SparkPost/services.yaml' }
    - { resource: '../src/App/services.yaml' }