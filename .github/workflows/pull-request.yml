name: Pull request

on: pull_request

jobs:
  phpstan-analyse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.3']

    steps:
      - uses: actions/checkout@v4.2.1

      # Only enable PHP extensions that are enabled on production. Still more than we need probably, but at least dependabot won't install symfony/redis-messenger this way
      - name: Setup PHP with tools # https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@2.31.1
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          ini-values: memory_limit=1536M, post_max_size=16M, date.timezone="Europe/Amsterdam"
          extensions: none, amqp, bcmath, Core, ctype, curl, date, dom, exif, fileinfo, filter, ftp, gd, hash, iconv, intl, json, libxml, mbstring, memcached, mysqlnd, openssl, pcre, PDO, pdo_mysql, Phar, posix, readline, Reflection, session, SimpleXML, sockets, sodium, SPL, standard, tokenizer, xml, xmlreader, xmlwriter, zip, zlib

      - name: Copy symfony env file
        run: cp .env.ci-test .env
#      - name: Copy symfony config file
#        run: cp config/packages/parameters.yaml.dist config/packages/parameters.yaml

      # Prepare all the caches
      - name: Composer Cache
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4.1.1
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-versions }}

      - name: PHPStan Cache
        uses: actions/cache@v4.1.1
        with:
          path: var/cache/resultCache.php
          key: ${{ runner.OS }}-phpstan-${{ matrix.php-versions }}

      # Build requirements for running the static analysis & unit tests
      - run: composer install

      # Run static analysis
      - run: vendor/bin/phpstan analyse

